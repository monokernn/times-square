<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d101b" />
    <title>Times Square · After Hours</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main aria-label="Ночной Таймс-сквер">
      <canvas
        id="city"
        tabindex="0"
        aria-label="Трёхмерная площадь. Клик — включить обзор мышью, Esc — вернуть курсор, WASD — идти, F — пролёт, R — запись."
      ></canvas>
      <span class="gaze-dot" aria-hidden="true"></span>
      <div id="loading" role="status" aria-label="Загрузка площади">
        <i></i>
      </div>
      <nav aria-label="Камера">
        <button
          id="flight"
          title="Пролёт / прогулка (F)"
          aria-label="Включить пролёт"
          aria-pressed="false"
        >
          <svg viewBox="0 0 24 24">
            <path d="m3 10 17-6-6 17-3-8-8-3Zm8 3 9-9" />
          </svg></button
        ><button
          id="record"
          title="Записать пролёт (R)"
          aria-label="Записать пролёт"
          aria-pressed="false"
        >
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="6" />
          </svg></button
        ><button
          id="full"
          title="Полный экран (Enter)"
          aria-label="Полный экран"
        >
          <svg viewBox="0 0 24 24">
            <path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5" />
          </svg>
        </button>
      </nav>
      <div id="pad"><b></b></div>
      <output id="notice" aria-live="polite"></output>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
